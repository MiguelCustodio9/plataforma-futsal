name: Publicar funções Supabase

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Publicar Edge Functions
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Publicar funções
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Falta configurar o segredo SUPABASE_ACCESS_TOKEN no GitHub."
            exit 1
          fi
          supabase functions deploy invite-staff --project-ref tuimyjeuykecyxbawwlz --yes
          supabase functions deploy accept-staff-invite --project-ref tuimyjeuykecyxbawwlz --yes
          supabase functions deploy manage-staff-account --project-ref tuimyjeuykecyxbawwlz --yes
          supabase functions deploy manage-platform-access --project-ref tuimyjeuykecyxbawwlz --yes
